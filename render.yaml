# Sports Spreads production static service (observed Render configuration, 2026-11-18).
# Render currently publishes the generated standalone root index.html from public/.
# Do not switch to dist/ without a separate staged migration and browser verification.
services:
  - type: web
    name: sports-spreads
    runtime: static
    buildCommand: mkdir -p public && cp index.html public/index.html
    staticPublishPath: public
    autoDeployTrigger: commit
