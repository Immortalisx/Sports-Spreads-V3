name: V4 staging live read-only integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployed staging HTML, JavaScript and seven read-only Edge APIs
        run: node scripts/check-staging-live.mjs
