name: Audit actual NFL QB receiver blitz source joins (free)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'engine/audit-nfl-ftn-sources.py'
      - '.github/workflows/audit-nfl-ftn-sources.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download bounded 2025 public season data once and audit actual play-level joins
        run: python engine/audit-nfl-ftn-sources.py 2025
      - name: Publish aggregated source coverage only
        if: always()
        run: |
          if test -f research/nfl-ftn-source-coverage-2025.json; then
            cat research/nfl-ftn-source-coverage-2025.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Source unavailable — no feature promotion.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-ftn-source-coverage-2025
          path: research/nfl-ftn-source-coverage-2025.json
          if-no-files-found: ignore
          retention-days: 14
