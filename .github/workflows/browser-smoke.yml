name: Sports Spreads browser smoke
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-smoke.yml'
      - 'qa/browser-smoke.mjs'
      - 'src/app/**'
      - 'public/**'
      - 'index.html'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate tested standalone site
        run: npm run build:onefile
      - name: Install temporary test-only Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run desktop, mobile and TV browser interaction checks
        run: node qa/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-spreads-browser-screenshots
          path: qa/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3
