name: Sports Spreads browser smoke
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-smoke.yml'
      - 'qa/browser-smoke.mjs'
      - 'qa/performance-benchmark.mjs'
      - 'src/app/**'
      - 'public/**'
      - 'index.html'
      - 'test/**'
      - 'engine/**'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - 'package.json'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete Node regression suite
        run: npm test
      - name: Generate tested standalone site
        run: npm run build:onefile
      # The package has a "postinstall": "npm test" hook. Suppress it here:
      # npm test already ran above; running it again during Playwright setup is wasteful.
      # Headless tests use Playwright's Chromium headless shell, not the headed browser.
      - name: Install test-only Chromium headless shell (timed)
        run: |
          start=$SECONDS
          npm install --ignore-scripts --no-save --no-package-lock playwright@1.56.1
          echo "Playwright package install: $((SECONDS-start))s" | tee -a "$GITHUB_STEP_SUMMARY"
          browser_start=$SECONDS
          npx playwright install --with-deps --only-shell chromium
          echo "Chromium headless-shell + OS dependencies: $((SECONDS-browser_start))s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Total browser setup: $((SECONDS-start))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run desktop, mobile, tablet and TV browser interaction checks (timed)
        run: |
          start=$SECONDS
          node qa/browser-smoke.mjs
          echo "Browser smoke duration: $((SECONDS-start))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Benchmark emulated mobile and desktop (no provider credits, timed)
        if: always()
        run: |
          start=$SECONDS
          node qa/performance-benchmark.mjs
          echo "Performance benchmark duration: $((SECONDS-start))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-spreads-browser-screenshots
          path: qa/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-spreads-performance-lab
          path: qa/reports/performance-lab.json
          if-no-files-found: ignore
          retention-days: 14
