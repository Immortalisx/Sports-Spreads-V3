name: Sports Spreads browser smoke
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-smoke.yml'
      - 'qa/browser-smoke.mjs'
      - 'qa/performance-benchmark.mjs'
      - 'src/app/**'
      - 'public/**'
      - 'index.html'
      - 'test/**'
      - 'engine/**'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - 'package.json'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete Node regression suite
        run: npm test
      - name: Generate tested standalone site
        run: npm run build:onefile
      - name: Install temporary test-only Chromium
        timeout-minutes: 5
        run: |
          echo "Starting isolated headless Chromium QA setup (no provider access)"
          # Avoid root postinstall (npm test) running again during the temporary QA install.
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright --version
          # Both QA scripts launch headless Chromium; skip the unused full browser download.
          npx playwright install --with-deps --only-shell chromium
          echo "Headless Chromium QA setup completed"
      - name: Run desktop, mobile and TV browser interaction checks
        run: node qa/browser-smoke.mjs
      - name: Benchmark emulated mobile and desktop (no provider credits)
        if: always()
        run: node qa/performance-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-spreads-browser-screenshots
          path: qa/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-spreads-performance-lab
          path: qa/reports/performance-lab.json
          if-no-files-found: ignore
          retention-days: 14
