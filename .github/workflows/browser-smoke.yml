name: Sports Spreads browser smoke
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-smoke.yml'
      - 'qa/browser-smoke.mjs'
      - 'qa/performance-benchmark.mjs'
      - 'src/app/**'
      - 'public/**'
      - 'index.html'
      - 'test/**'
      - 'engine/**'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - 'package.json'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The Verify Sports Spreads workflow runs the full Node 22 regression suite
      # on every PR and main push; this job owns independent browser coverage.
      - name: Generate standalone site for browser checks
        run: npm run build:onefile
      # The package has a "postinstall": "npm test" hook. Suppress it here:
      # regression tests are run by the separate Verify Sports Spreads workflow.
      # Headless tests use Playwright's Chromium headless shell, not the headed browser.
      - name: Install Playwright npm package (timed, bounded)
        timeout-minutes: 3
        run: |
          start=$SECONDS
          echo "Node: $(node --version); npm: $(npm --version)"
          echo "Installing pinned Playwright 1.56.1 without lifecycle scripts"
          npm install --ignore-scripts --no-save --no-package-lock --no-audit --no-fund --fetch-retries=2 --fetch-timeout=60000 playwright@1.56.1
          echo "Playwright package install: $((SECONDS-start))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install Chromium Linux dependencies (timed, bounded)
        timeout-minutes: 5
        run: |
          start=$SECONDS
          echo "Installing Linux libraries for Playwright Chromium headless shell"
          npx --no-install playwright install-deps chromium
          echo "Chromium Linux dependencies: $((SECONDS-start))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Download Chromium headless shell (timed, bounded)
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: |
          start=$SECONDS
          echo "Downloading Chromium headless shell and required Playwright runtime assets"
          npx --no-install playwright install --only-shell chromium
          echo "Chromium headless shell download: $((SECONDS-start))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run desktop, mobile, tablet and TV browser interaction checks (timed)
        run: |
          start=$SECONDS
          node qa/browser-smoke.mjs
          echo "Browser smoke duration: $((SECONDS-start))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Benchmark emulated mobile and desktop (no provider credits, timed)
        if: always()
        run: |
          start=$SECONDS
          node qa/performance-benchmark.mjs
          echo "Performance benchmark duration: $((SECONDS-start))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-spreads-browser-screenshots
          path: qa/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-spreads-performance-lab
          path: qa/reports/performance-lab.json
          if-no-files-found: ignore
          retention-days: 14
