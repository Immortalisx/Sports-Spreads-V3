name: Verify Sports Spreads
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate standalone release BEFORE running tests
        run: npm run build:onefile
      - name: Unit and integration tests
        run: npm test
      - name: Build static website
        run: npm run build:static
      - name: Verify release and published content are identical
        run: npm run verify:release
