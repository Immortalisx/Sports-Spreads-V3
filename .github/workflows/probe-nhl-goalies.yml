name: Probe free NHL goalie stats and team schedule schemas
on:
  pull_request:
    paths:
      - 'engine/probe-nhl-goalies.mjs'
      - '.github/workflows/probe-nhl-goalies.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify goalies, dated game logs, and current slate
        run: node engine/probe-nhl-goalies.mjs
