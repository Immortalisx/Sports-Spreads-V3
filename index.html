/* Compact, accessible live ticket ticker — previous values fade out as new values fade in. */
.ticket-ticker{position:sticky;top:10px;z-index:6;background:rgba(19,32,46,.97);border:1px solid #42604e;border-radius:15px;margin:12px 0 18px;padding:14px 18px 12px;box-shadow:0 12px 35px rgba(0,0,0,.3);backdrop-filter:blur(12px)}
.ticker-label{display:flex;align-items:center;gap:8px;color:#b8dfb0;font-size:10px;font-weight:800;letter-spacing:1.3px}
.ticker-indicator{height:7px;width:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(188,248,117,.12)}
.ticker-legs{letter-spacing:0;margin-left:auto;color:var(--muted);font-weight:700}
.ticker-values{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:11px}
.ticker-stat{min-width:0;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--stroke)}
.ticker-stat:last-child{border-right:0}
.ticker-name{font-size:10px;color:var(--muted);line-height:1.3}
.ticker-stat strong{font:800 23px/1.25 'Space Grotesk',sans-serif;color:var(--text);letter-spacing:-.5px;white-space:nowrap}
.ticker-stat:first-child strong,.ticker-stat:last-child strong{color:var(--accent)}
.ticker-change{display:inline-grid;position:relative;isolation:isolate;min-height:1.25em;vertical-align:baseline;max-width:100%}
.ticker-old,.ticker-new{grid-area:1/1;display:inline-block}
.ticker-old{position:absolute;left:0;right:0;top:0;animation:ticker-fade-out 330ms ease-out forwards;pointer-events:none}
.ticker-new{position:relative;animation:ticker-fade-in 330ms ease-out both}
@keyframes ticker-fade-out{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-7px)}}
@keyframes ticker-fade-in{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:translateY(0)}}
.ticker-disclaimer{color:#91a3af;font-size:10px;line-height:1.4;margin-top:10px}
@media(max-width:620px){.ticket-ticker{top:0;border-radius:12px;padding:11px 12px}.ticker-values{gap:7px;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}.ticker-stat:nth-child(2){border:0}.ticker-stat strong{font-size:21px}.ticker-disclaimer{font-size:9px}}
@media(prefers-reduced-motion:reduce){.ticker-old{display:none}.ticker-new{animation:none!important}}

/* V2.2 — Progressive disclosure; correlation, player props and archiving. */
.correlation-warning{background:#2c261d;border:1px solid #675235;border-radius:12px;color:#f5d6a5;padding:12px;margin:12px 0;font-size:12px;line-height:1.5}
.correlation-warning strong{display:block;margin-bottom:3px}.correlation-warning ul{margin:5px 0 7px;padding-left:18px}.correlation-warning li{margin:3px 0}.correlation-warning small{color:#e3c7a3}
.ticker-risk{color:#f6cf91;font-size:11px;margin-top:9px}
.prop-control{grid-column:1/-1;background:#172436;border-radius:12px;border:1px solid #35475d;padding:12px;display:grid;gap:7px}
.prop-control label{display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:11px;color:#dae6f1;text-transform:uppercase;letter-spacing:.6px;font-weight:800}

function ticketWarnings(legs=state.ticket){
 const warnings=[];
 const seen=new Map(), byGame=new Map(), byPlayer=new Map();
 for(const leg of legs){
  const key=[leg.league,leg.market,String(leg.selection).trim().toLowerCase(),String(leg.notes||'').trim().toLowerCase()].join('|');
  if(seen.has(key))warnings.push({kind:'duplicate',message:`Repeated selection: ${leg.selection}`});
  else seen.set(key,true);
  if(leg.gameId){const group=byGame.get(leg.gameId)||[];if(group.length && !group.some(x=>x.market===leg.market&&x.selection===leg.selection))warnings.push({kind:'same-game',message:`Multiple legs from one game may be correlated or restricted by the sportsbook.`});group.push(leg);byGame.set(leg.gameId,group);}
  if(leg.playerId){const group=byPlayer.get(`${leg.league}/${leg.playerId}`)||[];if(group.length && !group.some(x=>x.market===leg.market&&x.selection===leg.selection))warnings.push({kind:'player-overlap',message:`Multiple props on one player may be correlated.`});group.push(leg);byPlayer.set(`${leg.league}/${leg.playerId}`,group);}
 }
 return warnings.filter((w,i,a)=>a.findIndex(x=>x.kind===w.kind&&x.message===w.message)===i);
}

function publicShareUrl(){const origin=globalThis.location?.origin;return /^https:\/\/[-a-z0-9.]+\.onrender\.com$/i.test(origin||'')?origin+'/':'https://sports-spreads.onrender.com/';}
async function copyText(value){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);return true;}}catch{}try{const field=document.createElement('textarea');field.value=value;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const worked=document.execCommand('copy');field.remove();return worked;}catch{return false;}}
function overlay(){if(!state.drawer)return'';return `<div class="shade" data-action="close" aria-hidden="true"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Details panel">${state.drawer.type==='team'?teamDrawer():state.drawer.type==='player'?playerDrawer():state.drawer.type==='feedback'?feedbackDrawer():gameDrawer()}</aside>`;}
function ticketDock(){
 if(state.section==='tickets'||state.drawer)return '';
 const est=calcTicket();return `<button class="ticket-dock" data-action="nav" data-section="tickets" aria-label="Open parlay builder with ${state.ticket.length} legs"><span class="dock-label"><span class="dock-dot">●</span> MY TICKET <span class="dock-count">${state.ticket.length} legs</span></span><strong>${est?americanCombined(est.multiplier):'Build ticket'} <span aria-hidden="true">↗</span></strong></button>`;
}
function render(){app.innerHTML=`<div class="layout">${navigation()}<main class="site">${topbar()}${state.section==='games'?board():state.section==='teams'?directoryView():state.section==='tickets'?ticketView():state.section==='history'?historyView():aboutView()}</main></div>${ticketDock()}${overlay()}`;document.body.style.overflow=state.drawer?'hidden':'';}
function notify(s){document.getElementById('announcer').textContent=s;}
async function loadBoard(){
 const league=state.league,date=state.date;
 if(window.__STANDALONE_PREVIEW__){state.loading=false;state.error='Checking the read-only sports feed';state.feed={games:demoGames(league),demo:true,updatedAt:null};}
 else{state.loading=true;state.error='';state.feed=null;}
 render();
 try{const json=await readSportsData(`/api/scoreboard?league=${league}&date=${date.replaceAll('-','')}`);if(state.league!==league||state.date!==date)return;state.feed=json;state.error='';}
 catch(e){if(state.league!==league||state.date!==date)return;state.error=e.message||'Provider unavailable';state.feed={games:demoGames(league),demo:true,updatedAt:null};}
 finally{if(state.league===league&&state.date===date){state.loading=false;render();}}
}
async function loadTeams(force=false){
 const league=state.league;if(state.directory[league]&&!force){render();return;}state.directoryLoading[league]=true;render();
 try{const json=await readSportsData(`/api/teams?league=${league}`);state.directory[league]={...json,demo:false};}
 catch(e){const byId=new Map();for(const g of demoGames(league))for(const t of [g.away,g.home])byId.set(t.id,t);state.directory[league]={teams:[...byId.values()],error:e.message||'Feed unavailable',demo:true};}
 finally{state.directoryLoading[league]=false;render();}
}
function teamCacheKey(d,tab){return `${d.league}-${d.team.id}-${tab}`;}
async function loadTeam(tab,force=false){
 if(state.drawer?.type!=='team')return;const d=state.drawer,key=teamCacheKey(d,tab);
 if(state.teamCache[key]&&!force){render();return;}if(state.teamLoading[key])return;state.teamLoading[key]=true;delete state.teamErrors[key];render();
 try{const json=await readSportsData(`/api/team/${d.league}/${encodeURIComponent(d.team.id)}?view=${tab}&name=${encodeURIComponent(d.team.name)}`);state.teamCache[key]=json;}
 catch(e){state.teamErrors[key]=e.message||'Team feed unavailable';}
 finally{state.teamLoading[key]=false;render();}
}
function openTeam(game,side){if(!game)return;const team=game[side];if(!team?.id){notify('This team has no provider identifier.');return;}state.drawer={type:'team',league:game.league,team};state.teamTab='injuries';render();loadTeam('injuries');}
function openDirectoryTeam(id){const team=state.directory[state.league]?.teams?.find(t=>t.id===id);if(team){state.drawer={type:'team',league:state.league,team};state.teamTab='injuries';render();loadTeam('injuries');}}
function getRosterPlayer(id){const key=`${state.drawer.league}-${state.drawer.team.id}-roster`;return state.teamCache[key]?.roster?.find(p=>p.id===id);}
function saveTicket(){try{localStorage.setItem('ss-v2-ticket',JSON.stringify(state.ticket));}catch{notify('Browser storage is not available.');}}
async function loadCloudConfig(){
 if(!globalThis.SportsCloud)return;
 const c=SportsCloud.config();state.cloud.configured=c.configured;state.cloud.url=c.url;state.cloud.key=c.key;
 if(!c.configured)return;
 const newLogin=SportsCloud.consumeRedirect();state.cloud.token=SportsCloud.credentials().access;
 if(newLogin)state.cloud.status='Signed in securely for this tab.';
 if(state.cloud.token)await fetchCloudTickets();else render();
}
async function fetchCloudTickets(){
 if(!state.cloud.configured||!SportsCloud.credentials().access)return;
 try{state.cloud.tickets=await SportsCloud.tickets();state.cloud.token=SportsCloud.credentials().access;state.cloud.status=`${state.cloud.tickets.length} cloud snapshots loaded.`;}
 catch(e){state.cloud.status=e.message||'Cloud history unavailable.';}render();
}
async function sendLogin(email){
 try{await SportsCloud.emailLink(email);state.cloud.status='Check your email for the secure sign-in link.';}
 catch(e){state.cloud.status=e.message||'Sign-in failed.';}render();
}
async function saveCloudTicket(){
 const c=state.cloud;if(!c.configured||!SportsCloud.credentials().access)return;
 const estimate=calcTicket();if(!estimate){c.status='Enter valid odds and stake first.';render();return;}
 try{await SportsCloud.saveTicket({label:`Ticket · ${new Date().toLocaleDateString()}`,stake:Number(state.stake),legs:state.ticket});c.status='Saved securely to your account.';await fetchCloudTickets();}
 catch(e){c.status=e.message||'Cloud save failed.';render();}
}
function exportTicket(){const payload={format:'sports-spreads-v2-ticket',exportedAt:new Date().toISOString(),source:'user-entered',disclaimer:'No bet was placed; odds are not verified; model probabilities are not calculated.',legs:state.ticket,stake:state.stake};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sports-spreads-ticket.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='share'){const ok=await copyText(publicShareUrl());notify(ok?'Clean website link copied — paste it in Discord.':'Copy this link: '+publicShareUrl());return;}else if(action==='feedback'){state.drawer={type:'feedback'};render();return;}else if(action==='copy-feedback'){const type=document.getElementById('feedback-kind')?.value||'Feedback';const note=(document.getElementById('feedback-note')?.value||'').trim();if(!note){notify('Enter your feedback first.');return;}const report=`Sports Spreads beta feedback\n${type}\n${note}`;const ok=await copyText(report);notify(ok?'Feedback copied — paste it in Discord.':'Copy the feedback text into Discord.');if(ok){state.drawer=null;render();}return;}else if(action==='nav'){state.section=el.dataset.section;state.drawer=null;state.draft=null;render();if(state.section==='teams')loadTeams();window.scrollTo({top:0,behavior:'instant'});}else if(action==='league'){state.league=el.dataset.league;state.search='';state.drawer=null;if(state.section==='teams')loadTeams();else loadBoard();}else if(action==='reload-teams'){loadTeams(true);}else if(action==='directory-team'){openDirectoryTeam(el.dataset.teamId);}else if(action==='refresh'){loadBoard();}else if(action==='close'){state.drawer=null;render();}else if(action==='team'){openTeam(getGame(el.dataset.game),el.dataset.team);}else if(action==='game'){const game=getGame(el.dataset.game);if(game){state.drawer={type:'game',game};render();void loadGameWeather(game);}}else if(action==='weather-retry'){const game=getGame(el.dataset.game);if(game)void loadGameWeather(game,true);}else if(action==='teamtab'){state.teamTab=el.dataset.tab;loadTeam(state.teamTab);}else if(action==='retry-team'){loadTeam(state.teamTab,true);}else if(action==='player'){const player=getRosterPlayer(el.dataset.player);if(player){const team=state.drawer.team;state.drawer={type:'player',player,league:state.drawer.league,team};render();}}else if(action==='player-prop'){const d=state.drawer;if(d?.type==='player'){state.draft={league:d.league,selection:d.player.name,playerId:d.player.id,teamId:d.team.id,market:(PROPS[d.league]||[])[0]?.[0]||'Other'};state.league=d.league;state.section='tickets';state.drawer=null;render();window.scrollTo(0,0);}}else if(action==='back-team'){state.drawer={type:'team',league:state.drawer.league,team:state.drawer.team};state.teamTab='roster';render();}else if(action==='quickpick'){const game=getGame(el.dataset.game);state.draft={league:game.league,selection:`${game.away.name} to win`,gameId:game.demo?null:game.id};state.section='tickets';state.drawer=null;render();window.scrollTo(0,0);}else if(action==='remove-leg'){state.ticket.splice(Number(el.dataset.index),1);saveTicket();render();}else if(action==='clear-ticket'){state.ticket=[];saveTicket();render();}else if(action==='archive-ticket'){archiveTicket();}else if(action==='cloud-save'){await saveCloudTicket();}else if(action==='cloud-fetch'){await fetchCloudTickets();}else if(action==='cloud-signout'){await SportsCloud.signOut();state.cloud.token='';state.cloud.tickets=[];state.cloud.status='Signed out.';render();}else if(action==='restore-archive'){const snap=state.history[Number(el.dataset.index)];if(snap){state.ticket=JSON.parse(JSON.stringify(snap.legs));state.stake=String(snap.stake);state.section='tickets';saveTicket();render();notify('Loaded a copy. The saved snapshot is unchanged.');}}else if(action==='export-ticket'){exportTicket();}else if(action==='about'){state.section='about';render();}});
document.addEventListener('change',e=>{if(e.target.id==='date'){state.date=e.target.value||getTodayET();state.search='';loadBoard();}else if(e.target.id==='stake'){state.stake=e.target.value;render();}else if(e.target.id==='leg-market'||e.target.id==='leg-league'){const league=document.getElementById('leg-league').value;const marketSelect=document.getElementById('leg-market');if(e.target.id==='leg-league'){marketSelect.innerHTML=(MARKETS[league]||[]).map(m=>`<option>${esc(m)}</option>`).join('');}const market=marketSelect.value;document.getElementById('prop-controls')?.remove();const box=document.createElement('div');box.innerHTML=propFields(league,market);document.getElementById('leg-market').closest('.form-item').insertAdjacentElement('afterend',box.firstElementChild);const form=document.getElementById('leg-form');const control=document.getElementById('prop-line');if(control){const text=propNote(market,Number(control.value));document.getElementById('leg-notes').value=text;}}});
document.addEventListener('input',e=>{if(e.target.id==='prop-line'){const market=e.target.dataset.market;const text=propNote(market,Number(e.target.value));document.getElementById('prop-line-value').textContent=text;document.getElementById('leg-notes').value=text;}else if(e.target.id==='search'||e.target.id==='team-search'){const inputId=e.target.id;const caret=e.target.selectionStart;state.search=e.target.value;render();const replacement=document.getElementById(inputId);if(replacement){replacement.focus();replacement.setSelectionRange(caret,caret);}}});
document.addEventListener('submit',e=>{if(e.target.id==='cloud-login'){e.preventDefault();sendLogin(document.getElementById('cloud-email').value.trim());return;}if(e.target.id!=='leg-form')return;e.preventDefault();const selection=document.getElementById('leg-selection').value.trim();const odds=document.getElementById('leg-odds').value.trim();const number=parseAmerican(odds);const err=document.getElementById('form-error');if(!selection||number===null){err.textContent='Enter a selection and valid American odds (at least +100 or -100).';return;}if(state.ticket.length>=20){err.textContent='Prototype limit: 20 legs per ticket.';return;}state.ticket.push({id:`leg-${Date.now()}-${state.ticket.length}`,league:document.getElementById('leg-league').value,market:document.getElementById('leg-market').value,selection,odds:number,notes:document.getElementById('leg-notes').value.trim()||(document.getElementById('prop-line')?propNote(document.getElementById('leg-market').value,Number(document.getElementById('prop-line').value)):'') ,gameId:state.draft?.gameId||null,playerId:state.draft?.playerId||null,teamId:state.draft?.teamId||null,enteredAt:new Date().toISOString()});saveTicket();state.draft=null;render();notify('Added selection to your local ticket.');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.drawer){state.drawer=null;render();}});
render();loadBoard();loadCloudConfig();

</script>
</head>
<body>
  <div id="app" aria-live="off"></div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
</body>
</html>
