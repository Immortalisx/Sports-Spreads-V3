/* Compact, accessible live ticket ticker — previous values fade out as new values fade in. */
.ticket-ticker{position:sticky;top:10px;z-index:6;background:rgba(19,32,46,.97);border:1px solid #42604e;border-radius:15px;margin:12px 0 18px;padding:14px 18px 12px;box-shadow:0 12px 35px rgba(0,0,0,.3);backdrop-filter:blur(12px)}
.ticker-label{display:flex;align-items:center;gap:8px;color:#b8dfb0;font-size:10px;font-weight:800;letter-spacing:1.3px}
.ticker-indicator{height:7px;width:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(188,248,117,.12)}
.ticker-legs{letter-spacing:0;margin-left:auto;color:var(--muted);font-weight:700}
.ticker-values{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:11px}
.ticker-stat{min-width:0;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--stroke)}
.ticker-stat:last-child{border-right:0}
.ticker-name{font-size:10px;color:var(--muted);line-height:1.3}
.ticker-stat strong{font:800 23px/1.25 'Space Grotesk',sans-serif;color:var(--text);letter-spacing:-.5px;white-space:nowrap}
.ticker-stat:first-child strong,.ticker-stat:last-child strong{color:var(--accent)}
.ticker-change{display:inline-grid;position:relative;isolation:isolate;min-height:1.25em;vertical-align:baseline;max-width:100%}
.ticker-old,.ticker-new{grid-area:1/1;display:inline-block}
.ticker-old{position:absolute;left:0;right:0;top:0;animation:ticker-fade-out 330ms ease-out forwards;pointer-events:none}
.ticker-new{position:relative;animation:ticker-fade-in 330ms ease-out both}
@keyframes ticker-fade-out{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-7px)}}
@keyframes ticker-fade-in{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:translateY(0)}}
.ticker-disclaimer{color:#91a3af;font-size:10px;line-height:1.4;margin-top:10px}
@media(max-width:620px){.ticket-ticker{top:0;border-radius:12px;padding:11px 12px}.ticker-values{gap:7px;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}.ticker-stat:nth-child(2){border:0}.ticker-stat strong{font-size:21px}.ticker-disclaimer{font-size:9px}}
@media(prefers-reduced-motion:reduce){.ticker-old{display:none}.ticker-new{animation:none!important}}

/* V2.2 — Progressive disclosure; correlation, player props and archiving. */
.correlation-warning{background:#2c261d;border:1px solid #675235;border-radius:12px;color:#f5d6a5;padding:12px;margin:12px 0;font-size:12px;line-height:1.5}
.correlation-warning strong{display:block;margin-bottom:3px}.correlation-warning ul{margin:5px 0 7px;padding-left:18px}.correlation-warning li{margin:3px 0}.correlation-warning small{color:#e3c7a3}
.ticker-risk{color:#f6cf91;font-size:11px;margin-top:9px}
.prop-control{grid-column:1/-1;background:#172436;border-radius:12px;border:1px solid #35475d;padding:12px;display:grid;gap:7px}
.prop-control label{display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:11px;color:#dae6f1;text-transform:uppercase;letter-spacing:.6px;font-weight:800}

function parseAmerican(x){const v=Number(x);return Number.isInteger(v)&&Math.abs(v)>=100&&Math.abs(v)<=100000?v:null;}
function calcTicket(){if(!state.ticket.length)return null;let multiplier=1;for(const leg of state.ticket){const x=parseAmerican(leg.odds);if(x===null)return null;multiplier*=x>0?1+x/100:1+100/Math.abs(x);}const stake=Number(state.stake);if(!Number.isFinite(stake)||stake<=0||stake>1000000)return null;return {multiplier,return:multiplier*stake,profit:(multiplier-1)*stake};}
// The ticker uses independent transitions: the previous value fades away as the updated value settles.
// Combined odds and breakeven % are sportsbook-price mathematics, NOT a model prediction.
let previousTickerValues=null;
function americanCombined(multiplier){
 if(!Number.isFinite(multiplier)||multiplier<=1)return '—';
 const value=multiplier>=2?Math.round((multiplier-1)*100):-Math.round(100/(multiplier-1));
 return `${value>0?'+':''}${value}`;
}
function tickerAmount(key,value){

 }
 return `<span class="ticker-fixed">${esc(value)}</span>`;
}
function ticketTicker(estimate){

 };

function ticketWarnings(legs=state.ticket){
 const warnings=[];
 const seen=new Map(), byGame=new Map(), byPlayer=new Map();
 for(const leg of legs){
  const key=[leg.league,leg.market,String(leg.selection).trim().toLowerCase(),String(leg.notes||'').trim().toLowerCase()].join('|');
  if(seen.has(key))warnings.push({kind:'duplicate',message:`Repeated selection: ${leg.selection}`});
  else seen.set(key,true);
  if(leg.gameId){const group=byGame.get(leg.gameId)||[];if(group.length && !group.some(x=>x.market===leg.market&&x.selection===leg.selection))warnings.push({kind:'same-game',message:`Multiple legs from one game may be correlated or restricted by the sportsbook.`});group.push(leg);byGame.set(leg.gameId,group);}
  if(leg.playerId){const group=byPlayer.get(`${leg.league}/${leg.playerId}`)||[];if(group.length && !group.some(x=>x.market===leg.market&&x.selection===leg.selection))warnings.push({kind:'player-overlap',message:`Multiple props on one player may be correlated.`});group.push(leg);byPlayer.set(`${leg.league}/${leg.playerId}`,group);}
 }
 const quotedBooks=[...new Set(legs.map(x=>String(x.bookmaker||'').trim().toLowerCase()).filter(Boolean))];
 if(quotedBooks.length>1)warnings.push({kind:'multiple-books',message:'These odds come from different sportsbooks and may not be combinable on one ticket at the displayed payout.'});
 return warnings.filter((w,i,a)=>a.findIndex(x=>x.kind===w.kind&&x.message===w.message)===i);
}

async function generateAutomaticTicket(){
 if(state.ticket.length){state.autoTicket.status='Clear your current ticket to generate new selections.';render();return;}
 const games=(state.feed?.games||[]).filter(g=>!g.demo&&g.status==='scheduled'&&Date.parse(g.start)>Date.now());
 if(!games.length){state.autoTicket.status='No upcoming games on this date. Select a game day with scheduled matchups.';render();return;}
 state.autoTicket.status='Checking shared sportsbook snapshots…';render();
 let odds=state.odds[state.league];
 try{
  if(!odds||!['ok','cached','stale'].includes(odds.status)){
   odds=await SportsOdds.getBoard(state.league);
   state.odds[state.league]=odds;
  }
 }catch(e){state.autoTicket.status=e?.message||'No sportsbook prices available';render();return;}
 if(!['ok','cached'].includes(odds?.status)){
  state.autoTicket.status=odds?.status==='needs_key'?'Sportsbook key is not configured.':'No recent cached sportsbook lines. Try again when the next scheduled refresh completes.';
  render();return;
 }
 const candidates=[];
 for(const game of games){
  const market=SportsOdds.marketConsensus(game,odds);
  if(!market)continue;
  for(const side of ['home','away']){
   const book=side==='home'?market.bestHome:market.bestAway;
   if(!book)continue;
   candidates.push({league:game.league,market:'Moneyline',gameId:game.id,start:game.start,
    teamName:game[side].name,probability:side==='home'?market.homeProbability:market.awayProbability,
    odds:side==='home'?book.homePrice:book.awayPrice,bookmaker:book.title,bookmakerKey:book.key,oddsAsOf:book.asOf});
  }
 }
 const result=SportsAutoTicket.buildMarket(candidates,{target:state.autoTicket.target,maxLegs:2});
 if(!result.ok){state.autoTicket.status=result.reason;render();return;}
 state.ticket=result.legs;saveTicket();
 state.autoTicket.status=result.legs.length+' market-derived selection'+(result.legs.length===1?'':'s')+' generated. These are bookmaker estimates, NOT validated model picks. Recheck every price.';
 render();
}

document.addEventListener('submit',e=>{if(e.target.id==='cloud-login'){e.preventDefault();sendLogin(document.getElementById('cloud-email').value.trim());return;}if(e.target.id!=='leg-form')return;e.preventDefault();const selection=document.getElementById('leg-selection').value.trim();const odds=document.getElementById('leg-odds').value.trim();const number=parseAmerican(odds);const err=document.getElementById('form-error');if(!selection||number===null){err.textContent='Enter a selection and valid American odds (at least +100 or -100).';return;}if(state.ticket.length>=20){err.textContent='Prototype limit: 20 legs per ticket.';return;}state.ticket.push({id:`leg-${Date.now()}-${state.ticket.length}`,league:document.getElementById('leg-league').value,market:document.getElementById('leg-market').value,selection,odds:number,bookmaker:state.draft?.bookmaker||null,oddsAsOf:state.draft?.oddsAsOf||null,notes:document.getElementById('leg-notes').value.trim()||(document.getElementById('prop-line')?propNote(document.getElementById('leg-market').value,Number(document.getElementById('prop-line').value)):'') ,gameId:state.draft?.gameId||null,playerId:(state.lookup.chosen?.type==='player'&&state.lookup.chosen.selection===selection?state.lookup.chosen.id:null)||state.draft?.playerId||null,teamId:(state.lookup.chosen?.selection===selection?state.lookup.chosen.teamId:null)||state.draft?.teamId||null,enteredAt:new Date().toISOString()});saveTicket();state.draft=null;state.lookup.chosen=null;state.lookup.query='';render();notify('Added selection to your local ticket.');});
document.addEventListener('keydown',e=>{
 if(e.target?.id==='leg-selection'){
  if(e.key==='Escape'){state.lookup.query='';state.lookup.rows=[];drawLookup();return;}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
   if(!state.lookup.rows.length)return;e.preventDefault();
   state.lookup.active=(state.lookup.active+(e.key==='ArrowDown'?1:-1)+state.lookup.rows.length)%state.lookup.rows.length;drawLookup();return;
  }
  if(e.key==='Enter'&&state.lookup.rows.length&&state.lookup.active>=0){e.preventDefault();void acceptLookup(state.lookup.active);return;}
 }
 if(e.key==='Escape'&&state.drawer){state.drawer=null;render();return;}if(e.key==='Escape'&&state.bigScreen){changeBigScreen();}
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&state.bigScreen&&document.fullscreenEnabled){state.bigScreen=false;try{localStorage.setItem('ss-big-screen','0');}catch{}render();}});
function bootSportsSpreads(){
 app=document.getElementById('app');
 if(!app){console.error('Sports Spreads startup failed: #app is missing.');return;}
 try{render();loadBoard();loadCloudConfig();}
 catch(err){console.error('Sports Spreads startup error:',err);app.textContent='Sports Spreads could not start. Please reload the page.';}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootSportsSpreads,{once:true});
else bootSportsSpreads();

</script>
</head>
<body>
  <div id="app" aria-live="off"><div class="startup-message">Loading Sports Spreads…</div></div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
</body>
</html>
